<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Dark Blue Luxury Background Gradient -->
    <linearGradient id="bgBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="50%" stop-color="#1E3A8A"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
    
    <!-- Royal Gold Gradient -->
    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047"/>
      <stop offset="30%" stop-color="#EAB308"/>
      <stop offset="70%" stop-color="#CA8A04"/>
      <stop offset="100%" stop-color="#A16207"/>
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="10" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Background Card -->
  <rect width="500" height="500" rx="100" fill="url(#bgBlue)"/>
  
  <!-- Outer Gold Decorative Border -->
  <rect x="25" y="25" width="450" height="450" rx="80" fill="none" stroke="url(#goldGradient)" stroke-width="4" stroke-dasharray="12 6" opacity="0.4"/>

  <!-- MAIN CHECKBOX ICON (Centered & Enlarged) -->
  <g filter="url(#shadow)">
    <!-- Outer Golden Box Shell -->
    <rect x="110" y="110" width="280" height="280" rx="58" fill="#0F172A" stroke="url(#goldGradient)" stroke-width="14"/>
    
    <!-- Inner Blue Fill -->
    <rect x="126" y="126" width="248" height="248" rx="44" fill="url(#bgBlue)" opacity="0.95"/>

    <!-- THE CHECKMARK (علامة الصح الذهبية المضيئة) -->
    <path d="M 165 250 L 220 305 L 335 175" 
          fill="none" 
          stroke="url(#goldGradient)" 
          stroke-width="30" 
          stroke-linecap="round" 
          stroke-linejoin="round"/>
  </g>
</svg>