      <circle cx="244" cy="266" r="118" fill="white"/>
      <circle cx="298" cy="222" r="106" fill="black"/>
    </mask>
  </defs>

  <rect width="512" height="512" rx="96" fill="#1E2749"/>

  <g fill="#C9A227">
    <path d="M256 54 L272 168 L256 186 L240 168 Z"/>
    <path d="M256 458 L240 344 L256 326 L272 344 Z"/>
    <path d="M54 256 L168 240 L186 256 L168 272 Z"/>
    <path d="M458 256 L344 272 L326 256 L344 240 Z"/>
  </g>

  <rect width="512" height="512" fill="#F2DE9A" mask="url(#crescent)"/>
</svg>
