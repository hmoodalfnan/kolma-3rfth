<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="المتابع الإيماني">
  <!-- Same idea as icon.svg, but the frame is dropped and the tick thickened:
       at 16px the open box turns to mud and only the mark survives. -->
  <defs>
    <linearGradient id="gold" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#C9A227"/>
      <stop offset="0.55" stop-color="#F4E3A8"/>
      <stop offset="1" stop-color="#E8CF7A"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" rx="104" fill="#1E2749"/>

  <path
    d="M140 262 L224 346 L392 138"
    fill="none" stroke="url(#gold)" stroke-width="66"
    stroke-linecap="round" stroke-linejoin="round"/>
</svg>
