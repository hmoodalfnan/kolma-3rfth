    <rect x="132" y="132" width="248" height="248" rx="14" transform="rotate(45 256 256)"/>
  </g>
  <path d="M196 256 l40 42 l80 -92"
        fill="none" stroke="#FFFFFF" stroke-width="38"
        stroke-linecap="round" stroke-linejoin="round"/>
