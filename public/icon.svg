<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="المتابع الإيماني">
  <!--
    A tick that breaks out of its own box.

    The frame is drawn as an open path with a gap at the top-right, and the
    tick's long arm leaves through it. The idea is the point of the app: the box
    is the day's checklist, and the mark carries past it.

    Full-bleed background because iOS composites apple-touch-icon onto white,
    and everything stays inside r≈204 of centre for Android's maskable crop.
  -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2d6a4f"/>
      <stop offset="1" stop-color="#0d2a1e"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#C9A227"/>
      <stop offset="0.55" stop-color="#F4E3A8"/>
      <stop offset="1" stop-color="#E8CF7A"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" fill="url(#bg)"/>

  <!-- The box, opened at the top-right so the tick has somewhere to go. -->
  <path
    d="M300 116 H172 A56 56 0 0 0 116 172 V340 A56 56 0 0 0 172 396 H340 A56 56 0 0 0 396 340 V246"
    fill="none" stroke="url(#gold)" stroke-width="24" stroke-linecap="round" opacity="0.5"/>

  <!-- The mark itself, exiting through the gap. -->
  <path
    d="M172 258 L242 330 L400 128"
    fill="none" stroke="url(#gold)" stroke-width="46"
    stroke-linecap="round" stroke-linejoin="round"/>
</svg>
