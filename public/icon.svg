<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="سجل الأعمال">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#37427A"/>
      <stop offset="1" stop-color="#1E2749"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#E8CF7A"/>
      <stop offset="1" stop-color="#C9A227"/>
    </linearGradient>
  </defs>

  <!-- Full-bleed background keeps the icon valid as a maskable icon. -->
  <rect width="512" height="512" fill="url(#bg)"/>

  <!-- Eight-fold geometry: two squares at 45°, the classic rub-el-hizb outline.
       Held inside the central 60% so Android's maskable crop never clips it. -->
  <g fill="none" stroke="url(#gold)" stroke-width="16" stroke-linejoin="round" opacity="0.95">
    <rect x="148" y="148" width="216" height="216" rx="10"/>
    <rect x="148" y="148" width="216" height="216" rx="10" transform="rotate(45 256 256)"/>
  </g>

  <!-- The record itself: a completed mark at the centre. -->
  <path d="M203 258 l36 38 l73 -84"
        fill="none" stroke="#FFFFFF" stroke-width="30"
        stroke-linecap="round" stroke-linejoin="round"/>
</svg>
